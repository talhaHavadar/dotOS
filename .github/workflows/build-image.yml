name: Build image (reusable)
on:
  workflow_call:
    inputs:
      image:
        description: Image directory to build with `just build` (base, dev, ...)
        required: true
        type: string
      build-args:
        description: Extra arguments for the container build, e.g. --build-arg X=Y
        required: false
        type: string
        default: ""
      ref:
        description: Git ref/SHA to check out (defaults to the triggering ref)
        required: false
        type: string
        default: ""
      version-tag:
        description: Release tag to publish instead of latest/date; dev builds then use the base image with the same tag
        required: false
        type: string
        default: ""
      arches:
        description: JSON list of architectures to build (amd64, arm64)
        required: false
        type: string
        default: '["amd64", "arm64"]'
      disk-image:
        description: Also make a disk image with `just disk-image-embedded` and upload it as an artifact
        required: false
        type: boolean
        default: false
env:
  IMAGE: ${{ inputs.image }}
  VERSION_TAG: ${{ inputs.version-tag }}
  GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
  CONTAINER_RUNTIME: podman
  # Where buildah/podman keep RUN --mount=type=cache data when building as root
  BUILDAH_CACHE_DIR: /var/tmp/buildah-cache-0
jobs:
  # Names and the date tag are computed once, so both architectures stamp the
  # same VERSION_ID and push to the same tags even across midnight UTC.
  prepare:
    name: Prepare ${{ inputs.image }} build
    runs-on: ubuntu-26.04
    outputs:
      registry: ${{ steps.names.outputs.registry }}
      name: ${{ steps.names.outputs.name }}
      date-tag: ${{ steps.names.outputs.date-tag }}
      push: ${{ steps.names.outputs.push }}
    steps:
      - name: Compute names
        id: names
        env:
          REGISTRY: "ghcr.io/${{ github.repository_owner }}"
          # Published as <repo>-<image>, e.g. dotos-base
          NAME: "${{ github.event.repository.name }}-${{ inputs.image }}"
          PUSH: >-
            ${{ inputs.version-tag != '' ||

                (github.event_name != 'pull_request' &&
                 github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        run: |
          # Registry paths must be lowercase
          {
            echo "registry=${REGISTRY,,}"
            echo "name=${NAME,,}"
            echo "date-tag=$(date -u +%Y%m%d)"
            echo "push=${PUSH}"
          } >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ inputs.image }} image (${{ matrix.arch }})
    needs: prepare
    strategy:
      # One architecture failing must not cancel the other's cargo build
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    # Native runner per architecture: no qemu-user (bootc's build and install
    # steps do not work under it). Needs buildah >= 1.39 (podman >= 5.4): older
    # versions leave bind-mounted scripts out of the layer cache key, so script
    # changes would not rebuild
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE_REGISTRY: ${{ needs.prepare.outputs.registry }}
      IMAGE_NAME: ${{ needs.prepare.outputs.name }}
      DATE_TAG: ${{ needs.prepare.outputs.date-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9
        if: false
      - name: Check podman
        run: |
          # The arm64 runner image may not ship podman
          if ! command -v podman >/dev/null; then
            sudo apt-get update && sudo apt-get install -y podman
          fi
          podman --version
      - name: Install just
        uses: extractions/setup-just@v4
      # The build runs as root (`sudo podman` via the Justfile), so root needs
      # the registry credentials for the layer cache, base images and the push.
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Layer 1: RUN --mount=type=cache directories (apt debs/lists, rustup,
      # cargo registry, cargo target dir). These survive even when the
      # debian:unstable base digest changes, which invalidates every layer.
      # The key includes runner.arch, so the architectures never share them.
      - name: Restore build mount cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILDAH_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-buildah-${{ inputs.image }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildah-${{ inputs.image }}-
      # Layer 2: registry layer cache, one per architecture. Whole layers are
      # reused while the base image digest and instructions are unchanged
      # (e.g. only a late script changed). PRs only read from it.
      - name: Build image
        run: |
          CACHE_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}-cache-${ARCH}"
          CACHE_ARGS=(--layers --cache-from "$CACHE_IMAGE")
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            CACHE_ARGS+=(--cache-to "$CACHE_IMAGE")
          fi

          # The base tag is a multi-arch manifest, so each runner pulls its own
          if [ -n "$VERSION_TAG" ] && [ "$IMAGE" != "base" ]; then
            CACHE_ARGS+=(--build-arg "BASE_IMAGE=${IMAGE_REGISTRY}/${GITHUB_EVENT_REPOSITORY_NAME,,}-base:${VERSION_TAG}")
          fi

          # os-release VERSION_ID matches the pushed date tag
          BUILD_VERSION="$DATE_TAG" just build "$IMAGE" "${CACHE_ARGS[@]}" ${{ inputs.build-args }}
      - name: Fix cache permissions
        if: ${{ !cancelled() }}
        run: |
          if [ -d "$BUILDAH_CACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$BUILDAH_CACHE_DIR"
          fi
      # Saved even if the build failed, so a long cargo build is not lost
      - name: Save build mount cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUILDAH_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-buildah-${{ inputs.image }}-${{ github.run_id }}
      # Uses the same Justfile recipe as local builds, so CI exercises it on
      # every run; before the push, so an image that cannot be installed is
      # never published. Native runner only: bootc install fails under qemu-user.
      - name: Make disk image
        if: inputs.disk-image
        env:
          # The runner has no SELinux; the recipe would otherwise bind /sys/fs/selinux
          BUILD_SELINUX: "false"
        run: |
          for tool in sfdisk mkfs.vfat mkfs.ext4 zstd; do
            command -v "$tool" >/dev/null || MISSING=1
          done
          if [ -n "${MISSING:-}" ]; then
            sudo apt-get update && sudo apt-get install -y fdisk dosfstools e2fsprogs zstd
          fi
          out="$RUNNER_TEMP/disk"
          mkdir -p "$out"
          # Installed systems follow the published tag for `bootc upgrade`
          just disk-image-embedded "$IMAGE" latest "$out" ext4 \
            --target-imgref "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION_TAG:-latest}"
          zstd -T0 -10 --rm "$out/${IMAGE}-embedded.img" \
            -o "$out/${IMAGE_NAME}-${VERSION_TAG:-$DATE_TAG}-${ARCH}.img.zst"
          ls -l "$out"
      - name: Upload disk image
        if: inputs.disk-image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.VERSION_TAG || env.DATE_TAG }}-${{ matrix.arch }}-disk-image
          path: ${{ runner.temp }}/disk/*.img.zst
          # Already zstd-compressed
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      # Per-architecture tags (<tag>-amd64, <tag>-arm64); the manifest job
      # below publishes the plain tags.
      - name: Push to GHCR
        if: needs.prepare.outputs.push == 'true'
        run: |
          if [ -n "$VERSION_TAG" ]; then
            TAGS=("$VERSION_TAG")
          else
            TAGS=(latest "$DATE_TAG")
          fi
          for tag in "${TAGS[@]}"; do
            sudo podman push "${IMAGE}-bootc:latest" "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}-${ARCH}"
          done
  manifest:
    name: Publish ${{ inputs.image }} manifest
    needs: [prepare, build]
    if: needs.prepare.outputs.push == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ${{ needs.prepare.outputs.registry }}
      IMAGE_NAME: ${{ needs.prepare.outputs.name }}
      DATE_TAG: ${{ needs.prepare.outputs.date-tag }}
      ARCHES: ${{ join(fromJSON(inputs.arches), ' ') }}
    steps:
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push multi-arch manifests
        run: |
          if [ -n "$VERSION_TAG" ]; then
            TAGS=("$VERSION_TAG")
          else
            TAGS=(latest "$DATE_TAG")
          fi
          for tag in "${TAGS[@]}"; do
            ref="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            podman manifest rm "$ref" 2>/dev/null || true
            podman manifest create "$ref"
            for arch in $ARCHES; do
              podman manifest add "$ref" "docker://${ref}-${arch}"
            done
            podman manifest push --all "$ref" "docker://${ref}"
          done
