name: Build base image
on:
  push:
    branches:
      - main
    paths:
      - "base/**"
      - "scripts/**"
      - "Justfile"
      - ".github/workflows/build-base.yml"
      - ".github/workflows/build-image.yml"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - "base/**"
      - "scripts/**"
      - "Justfile"
      - ".github/workflows/build-base.yml"
      - ".github/workflows/build-image.yml"
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: base
      version-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
