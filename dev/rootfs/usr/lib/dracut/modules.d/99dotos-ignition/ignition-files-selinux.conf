# Debian's Ignition always relabels written files and reads the policy name
# from the target's /etc/selinux/config first. This image has no SELinux (and
# bootc refuses an /etc/selinux/config without a policy), so provide a
# throwaway config for this stage only; setfiles is a no-op stub.
[Service]
ExecStartPre=/bin/sh -c 'if [ ! -e /sysroot/etc/selinux/config ]; then mkdir -p /sysroot/etc/selinux && echo SELINUXTYPE=none > /sysroot/etc/selinux/config && touch /run/dotos-selinux-stub; fi'
ExecStartPost=-/bin/sh -c 'if [ -e /run/dotos-selinux-stub ]; then rm -f /sysroot/etc/selinux/config /run/dotos-selinux-stub; fi'
ExecStopPost=-/bin/sh -c 'if [ -e /run/dotos-selinux-stub ]; then rm -f /sysroot/etc/selinux/config /run/dotos-selinux-stub; fi'
