# Same fixed IDs as dev/scripts/nix-users.sh, which pre-creates them because
# Ignition adds users (to nix-users) before systemd-sysusers runs
g nixbld 900
g nix-users 901
u nixbld1 901:nixbld "Nix build user 1" /var/empty /usr/sbin/nologin
m nixbld1 nixbld
