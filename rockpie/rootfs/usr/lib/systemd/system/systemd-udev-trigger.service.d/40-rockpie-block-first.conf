# Coldplug block devices first. The full trigger lists all ~1900 devices and
# /sys/module entries (~1.4 s of CPU on the RK3328) before sending any event,
# then sends the 742 module entries before block devices. The ESP (boot.mount,
# local-fs.target) waited ~1 s for that; a block-only trigger lists in ~60 ms.
# Block devices get a second, harmless add event from the full trigger.
# dracut copies this into the initramfs too, where 50-rockpie-devices-only.conf
# (modules.d/90rockpie-initrd) replaces it.
[Service]
ExecStart=
ExecStart=-udevadm trigger --action=add --subsystem-match=block
ExecStart=-udevadm trigger --type=all --action=add --prioritized-subsystem=module,block,tpmrm,net,tty,input
