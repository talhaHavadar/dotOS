# Don't autoload the RK3328 crypto engine driver. Its hashes fail the kernel
# self-tests (WARN traces at every boot: wrong state size and an inverted
# completion poll in drivers/crypto/rockchip), nothing uses it (AF_ALG and
# fs-verity only use CPU crypto), and it is ~3x slower than the ARMv8 crypto
# instructions anyway. `modprobe rk_crypto` still loads it by hand.
blacklist rk_crypto
