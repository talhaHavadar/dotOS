# ROCK Pi E: the initramfs only has to mount the root filesystem from the
# microSD card or eMMC, so list exactly what that needs instead of every
# driver and feature dracut supports (43 MB -> 14 MB). dracut adds the
# dependencies of both lists. Extend them for other root devices (USB, NVMe) or LUKS.
# rockpie-initrd (../modules.d/90rockpie-initrd) limits udev's coldplug to
# devices in the initramfs.
dracutmodules=" systemd-initrd dracut-systemd bootc rootfs-block kernel-modules base rockpie-initrd "
# SD/eMMC controller (both dw_mmc), their power (GPIO regulator, RK805 PMIC
# over I2C, the 1.8 V eMMC I/O domain) and the root filesystem; bootc adds
# erofs and overlay itself.
drivers=" dw_mmc_rockchip fixed gpio_rockchip rk808_regulator i2c_rk3x io_domain ext4 "
# Codepage modules dracut adds for FAT; the initramfs never mounts the ESP.
omit_drivers+=" nls_.* mac-.* "
# U-Boot leaves the CPU at 600 MHz and cpufreq-dt is a module. Load it, and
# the chain its CPU regulator needs (the fixed vcc_sys feeding the RK805 PMIC,
# I2C, GPIO for the PMIC interrupt), before udev starts, so the rest of the
# boot runs at up to 1.3 GHz.
force_drivers+=" fixed gpio_rockchip i2c_rk3x rk808_regulator cpufreq_dt "
# Probe the SD/eMMC controller before udev too: card init starts ~1 s earlier
# and runs in parallel with udev's startup.
force_drivers+=" dw_mmc_rockchip "
