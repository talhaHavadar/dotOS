# Initramfs only: coldplug devices, not the ~1500 bus and module entries of
# --type=all. Their events matter only to units in the real root (e.g.
# sys-module-fuse.device), where the full trigger runs again.
[Service]
ExecStart=
ExecStart=-udevadm trigger --type=devices --action=add --prioritized-subsystem=block,tpmrm,net,tty,input
